# Open Cube OS - 3.0.0-WP-01-ocire-core
# File: ocire/grub-dual.cfg
# Purpose: GRUB config for the dual-boot disk (hd0 of the WP-01 layout).
#          The user picks the OS from this menu: OCOS (default) or OCIRE.
#          Serial output mirrors the menu; keyboard input comes from the
#          console so automated tests can select entries with the QEMU
#          monitor sendkey while serial traffic goes to the kernels.

insmod serial
insmod terminal
serial --unit=0 --speed=115200
terminal_output console serial
terminal_input serial console
set timeout=8
set default=0

menuentry "Open Cube OS 2.2.0 (disk)" {
  multiboot2 (hd0,msdos1)/boot/opencube.elf oc.slot=ISO
  module2 (hd0,msdos1)/boot/opencube.elf self
  boot
}

menuentry "OCIRE - recovery kernel (3.0.0-WP-01)" {
  # Whole-disk blocklist: 128 sectors from hd1 LBA 2048 (the 0xEE
  # shadow partition start, where make_ocire_disk.sh dd's the kernel).
  multiboot2 (hd1)2048+128
  boot
}
