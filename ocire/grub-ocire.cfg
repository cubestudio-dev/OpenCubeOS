# Open Cube OS - 3.0.0-WP02-ocire_recovery
# File: ocire/grub-ocire.cfg
# Purpose: GRUB config for the standalone OCIRE boot ISO (build/ocire/ocire.iso).
#          The image is OCIRE-only: a single menu entry, serial output
#          mirrored, keyboard input taken from the console so automated
#          serial input goes to the kernel, not to the menu.
#
# WP-02: the OCIRE multiboot2 header requests an 800x600x32 linear
# framebuffer.  The video recipe mirrors the OCOS ISO one (loadfont +
# gfxterm on terminal_output + gfxmode/gfxpayload): GRUB only puts a
# real RGB framebuffer tag into the multiboot2 info when its own
# gfxterm runs on that video surface.  The menu itself is timed
# (timeout=1); tests never type into it, so serial stays the kernels'
# service channel.

insmod serial
insmod terminal
insmod vbe
insmod video
insmod video_fb
insmod gfxterm
insmod font
loadfont /boot/grub/fonts/unicode.pf2
serial --unit=0 --speed=115200
terminal_output serial gfxterm
terminal_input console
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=800x600x32
set gfxpayload=keep
echo "GFXTERM_INIT"
set timeout=1
set default=0

menuentry "OCIRE - OpenCubeOS Independent Recovery Environment" {
  multiboot2 /boot/ocire.elf
  boot
}
