insmod vbe
insmod video
insmod video_fb
insmod gfxterm
insmod font
insmod iso9660
insmod multiboot2
insmod serial
insmod fat
insmod part_msdos
insmod search
insmod search_fs_file
loadfont /boot/grub/fonts/unicode.pf2
serial --unit=0 --speed=115200
# GRUB output goes to both serial and gfxterm, but input is console only
# (so our test scripts can send serial input to the kernel without GRUB
# interpreting it as menu keystrokes).
terminal_input console
terminal_output serial gfxterm
set color_normal=light-gray/black
set color_highlight=black/light-gray
set gfxmode=800x600x32
set gfxpayload=keep
echo "GFXTERM_INIT"

# ------------------------------------------------------------------
# WP-10u A/B slot selection.
#
# The A/B update disk (first hard disk, hd0) holds the boot flags on
# partition 1:
#   /boot/next_B      - an update switched the next boot to slot B
#   /boot/bootfail_B  - slot B was tried and never confirmed (rollback!)
#   /boot/ok_B        - slot B booted fine at least once (confirmed)
#
# Selection:
#   flags + next_B + !bootfail_B -> slot B   (update pending)
#   flags + next_B +  bootfail_B -> slot A   (AUTOMATIC ROLLBACK)
#   flags + ok_B                 -> slot B   (confirmed default)
#   flags (otherwise)            -> slot A
#   no A/B disk                  -> the copy on this ISO ("ISO" slot)
#
# When a slot kernel is missing GRUB shows an error and the menu offers
# the "force" entries below (manual rollback path).
# ------------------------------------------------------------------
set slotid="ISO"
set slotroot=""
set haveab="no"
if [ -f (hd0,msdos1)/boot/grub/grub.cfg ]; then
  set haveab="yes"
  set slotroot="(hd0,msdos2)"
  set slotid="A"
  if [ -f (hd0,msdos1)/boot/next_B ]; then
    if [ -f (hd0,msdos1)/boot/bootfail_B ]; then
      set slotroot="(hd0,msdos2)"
      set slotid="A"
    else
      set slotroot="(hd0,msdos3)"
      set slotid="B"
    fi
  else
    if [ -f (hd0,msdos1)/boot/ok_B ]; then
      set slotroot="(hd0,msdos3)"
      set slotid="B"
    fi
  fi
fi
echo "BOOT_SLOT=${slotid} HAVE_AB=${haveab}"

set timeout=5
set default=0
menuentry "Open Cube OS (slot ${slotid})" {
  if [ "$slotid" = ISO ]; then
    multiboot2 /boot/opencube.elf oc.slot=ISO
  else
    multiboot2 ${slotroot}/boot/opencube.elf oc.slot=${slotid}
  fi
  boot
}
menuentry "Open Cube OS (slot A, force)" {
  multiboot2 (hd0,msdos2)/boot/opencube.elf oc.slot=A
  boot
}
menuentry "Open Cube OS (slot B, force)" {
  multiboot2 (hd0,msdos3)/boot/opencube.elf oc.slot=B
  boot
}
