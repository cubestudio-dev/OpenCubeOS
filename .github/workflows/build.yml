# Open Cube OS 3.0.0 - WP00-environment_restore
# File: .github/workflows/build.yml
# Purpose: CI gate for the restored 3.0.0 mainline tree. Builds the
#          full WP-13 pipeline (`make all`: userprogs -> kernel ->
#          dual-firmware OCBL ISO -> deterministic src zip -> OTA
#          package) under the zero-warning gate (-Wall -Wextra
#          -Werror, enforced by the Makefiles of every component),
#          verifies the artifacts, and checks `make clean` leaves
#          nothing behind.
#
# Provenance note (honest declaration, WP00): the 3.0.0 mainline had
# NO CI workflow file at its last mainline commit - nothing to
# restore. This file is NEW infrastructure written for the restored
# tree so "CI green" remains an enforceable gate. It builds, it does
# not boot (QEMU runs are sandbox-only acceptance steps).

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 3.0.0 build (0-warning gate)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential nasm xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin grub-common

      - name: Select compiler (prefer gcc-14, the release compiler)
        id: cc
        run: |
          sudo apt-get install -y -qq gcc-14 || true
          if command -v gcc-14 >/dev/null; then
            echo "cc=gcc-14" >> "$GITHUB_OUTPUT"
          else
            echo "cc=gcc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (make all - full WP-13 pipeline)
        run: make all CC=${{ steps.cc.outputs.cc }}

      - name: Verify artifacts
        run: |
          file build/opencube.elf
          file build/opencube.iso
          test -s build/opencube.elf
          test -s build/opencube.iso
          file build/opencube.elf | grep -q 'ELF 64-bit'
          file build/opencube.iso | grep -q 'ISO 9660'
          # dual-firmware El Torito: the same ISO boots BIOS and UEFI
          report="$(xorriso -indev build/opencube.iso \
                     -report_el_torito plain | tr -s ' ')"
          echo "$report"
          echo "$report" | grep -q 'El Torito boot img : 1 BIOS y none'
          echo "$report" | grep -q 'El Torito boot img : 2 UEFI y none'
          ls -la dist/
          test -s "dist/OpenCubeOS-src-3.0.0-WP06g3.zip"
          test -s "dist/OpenCubeOS-3.0.0-WP06g3-update.tar.gz"
          echo "artifacts verified"

      - name: Verify make clean leaves no products
        run: |
          make clean
          left=$(find build dist -type f 2>/dev/null | wc -l)
          echo "leftover build products: $left"
          test "$left" -eq 0
