# Open Cube OS NAK - NAK-01-tree
# File: .github/workflows/build.yml
# Purpose: CI gate for the NAK tree. Builds every component through
#          the root Makefile (today: the ocos.elf kernel stub) under
#          the zero-warning gate (-Wall -Wextra -Werror), verifies the
#          ELF artifact, then verifies `make clean` leaves nothing
#          behind. Legacy 3.0.0 targets (iso, src-zip, ota, ...) are
#          archived under archive/v3.0.0/ and are NOT part of NAK CI.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NAK build (0-warning gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all components (make all, -Werror gate)
        run: make all

      - name: Verify ocos.elf artifact
        run: file ocos/ocos.elf

      - name: Verify make clean leaves no products
        run: |
          make clean
          if [ -e ocos/ocos.elf ]; then echo "FAIL: ocos/ocos.elf survived make clean"; exit 1; fi
          left=$(find ocos -name '*.o' -o -name '*.d' -o -name '*.elf' | wc -l)
          echo "leftover build products: $left"
          test "$left" -eq 0
