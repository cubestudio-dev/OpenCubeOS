# Open Cube OS NAK - WP-01-tree
# File: .github/workflows/build.yml
# Purpose: CI gate for the NAK tree. Installs the toolchain, builds
#          every component (kernel.elf + nak.iso + placeholders) under
#          the zero-warning gate (-Wall -Wextra -Werror), verifies the
#          artifacts, then verifies `make clean` leaves nothing behind.
#          Legacy 3.0.0 targets (iso, src-zip, ota, ...) are archived
#          under archive/v3.0.0/ and are NOT part of NAK CI.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NAK build (0-warning gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential nasm xorriso mtools grub-pc-bin grub-common

      - name: Build ocos (kernel.elf + nak.iso)
        run: make -C ocos all

      - name: Build ocbl
        run: make -C ocbl all

      - name: Build ocse
        run: make -C ocse all

      - name: Build ocire
        run: make -C ocire all

      - name: Verify artifacts
        run: |
          file ocos/build/kernel.elf
          file ocos/build/nak.iso

      - name: Verify make clean leaves no products
        run: |
          make clean
          left=$(find ocos ocbl ocse ocire \
                 -name '*.o' -o -name '*.d' -o -name '*.elf' -o -name '*.iso' | wc -l)
          echo "leftover build products: $left"
          test "$left" -eq 0
