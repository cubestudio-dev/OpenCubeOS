# Open Cube OS NAK - WP-02-ocbl
# File: .github/workflows/build.yml
# Purpose: CI gate for the NAK tree. Installs the toolchain (including
#          mingw-w64 for the UEFI PE32+ bootloader), builds every
#          component (kernel.elf + opencubenak-WP-01-tree.iso +
#          ocbl-bios.bin + ocbl-uefi.efi + placeholders) under the
#          zero-warning gate (-Wall -Wextra -Werror), builds the
#          source zip release asset and verifies its contents, runs
#          the no-GRUB and firmware-decoupling grep gates, then
#          verifies `make clean` leaves nothing behind. Legacy 3.0.0
#          targets (iso, src-zip, ota, ...) are archived under
#          archive/v3.0.0/ and are NOT part of NAK CI.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: NAK build (0-warning gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential nasm xorriso mtools grub-pc-bin grub-common \
            gcc-mingw-w64-x86-64

      - name: Build ocos (kernel.elf + opencubenak-WP-01-tree.iso)
        run: make -C ocos all

      - name: Build ocbl (ocbl-bios.bin + ocbl-uefi.efi)
        run: make -C ocbl all

      - name: Build ocse
        run: make -C ocse all

      - name: Build ocire
        run: make -C ocire all

      - name: Verify artifacts
        run: |
          file ocos/build/kernel.elf
          file ocos/build/opencubenak-WP-01-tree.iso
          file ocbl/build/ocbl-bios.bin
          file ocbl/build/ocbl-uefi.efi
          test "$(stat -c%s ocbl/build/ocbl-bios.bin)" -gt 512
          file ocbl/build/ocbl-uefi.efi | grep -q 'PE32+ executable for EFI'

      - name: Gate - no GRUB in the bootloader
        run: |
          if grep -rniE 'grub' ocbl/boot ocbl/drivers ocbl/lib ocbl/Makefile; then
            echo "ERROR: GRUB reference inside ocbl/"
            exit 1
          fi
          echo "ocbl/ tree is GRUB-free"

      - name: Gate - BIOS/UEFI decoupling
        run: |
          if grep -rn -iE '#include.*(uefi|efi)' \
              ocbl/boot/core_boot_bios_stage1.S \
              ocbl/boot/core_boot_bios_stage2.S \
              ocbl/boot/core_boot_bios_stage2b.S \
              ocbl/boot/core_boot_bios_main.c \
              ocbl/boot/core_boot_bios_layout.h \
              ocbl/drivers/drv_video_vga.c \
              ocbl/drivers/drv_video_vga.h; then
            echo "ERROR: BIOS code includes UEFI headers"
            exit 1
          fi
          if grep -rn -E '#include.*bios|core_boot_bios_|CORE_BOOT_BIOS_' \
              ocbl/boot/core_boot_uefi.c \
              ocbl/boot/core_boot_uefi.h \
              ocbl/drivers/drv_video_uefi_gop.c \
              ocbl/drivers/drv_video_uefi_gop.h; then
            echo "ERROR: UEFI code references BIOS headers/symbols"
            exit 1
          fi
          echo "BIOS and UEFI paths are decoupled"

      - name: Build source zip (release asset)
        run: make srczip

      - name: Verify source zip contents
        run: |
          unzip -l build/opencubenak-WP-02-ocbl-src.zip > /tmp/ziplist.txt
          # the four component trees and the root files must be inside
          grep -q 'opencubenak-WP-02-ocbl-src/ocos/' /tmp/ziplist.txt
          grep -q 'opencubenak-WP-02-ocbl-src/ocbl/' /tmp/ziplist.txt
          grep -q 'opencubenak-WP-02-ocbl-src/ocse/' /tmp/ziplist.txt
          grep -q 'opencubenak-WP-02-ocbl-src/ocire/' /tmp/ziplist.txt
          grep -q 'opencubenak-WP-02-ocbl-src/README.md' /tmp/ziplist.txt
          # archive/ and build/ must NOT be inside
          if grep -E 'opencubenak-WP-02-ocbl-src/(archive|build)/' /tmp/ziplist.txt; then
            echo "ERROR: forbidden paths inside the source zip"
            exit 1
          fi
          echo "source zip contents verified"

      - name: Verify make clean leaves no products
        run: |
          make clean
          left=$(find ocos ocbl ocse ocire \
                 -name '*.o' -o -name '*.d' -o -name '*.elf' -o -name '*.iso' \
                 -o -name '*.bin' -o -name '*.efi' | wc -l)
          echo "leftover build products: $left"
          test "$left" -eq 0
