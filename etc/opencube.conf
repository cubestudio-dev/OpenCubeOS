# Open Cube OS configuration
# Update check URL (HTTP or HTTPS)
update_url=https://cubestudio-dev.github.io/OpenCubeOS/update.json

# Update package base URL (WP-10u, HTTP or HTTPS)
package_url=https://github.com/cubestudio-dev/OpenCubeOS/releases/latest

# Auto check on boot (yes / no)
auto_check=no

# Enable online system update (yes / no)
online_update=yes

# Shell output language (en / zh); switch at runtime with `lang en|zh`
shell.lang=en

# Boot UI (log / splash).  `log` prints the classic scrolling boot log
# with timestamps - the factory default, because it is what makes a
# failed boot diagnosable.  `splash` shows the centred logo plus the
# phase progress bar instead (the full log still goes to klog and the
# serial transcript).  Change it at runtime with `config set boot.ui
# splash` or `boot-ui splash`; it takes effect on the NEXT boot.
boot.ui=log
