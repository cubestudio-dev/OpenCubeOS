#
# Open Cube OS - WP-10u disk GRUB configuration.
# Lives on the A/B flag partition as /boot/grub/grub.cfg (partition 1 of
# the A/B disk).  Same selection logic as the ISO grub.cfg: next_B /
# bootfail_B / ok_B flag files decide between slot A (msdos2) and slot
# B (msdos3), with automatic rollback to A when B never confirmed.
# Refreshed by every update install (package boot/grub.cfg).
#
# NOTE: this file assumes GRUB's own stage files live on this disk
# (grub-install /boot/efi-partition or the MBR gap on real hardware).

insmod fat
insmod part_msdos
insmod serial
set timeout=5
set default=0
serial --unit=0 --speed=115200
terminal_input console
terminal_output serial console

set slotid="A"
set slotroot="(hd0,msdos2)"
if [ -f (hd0,msdos1)/boot/next_B ]; then
  if [ -f (hd0,msdos1)/boot/bootfail_B ]; then
    set slotroot="(hd0,msdos2)"
    set slotid="A"
  else
    # BUG-0305: boot-attempt budget. GRUB cannot create files, so the
    # 1024-byte environment block /boot/grub/grubenv must pre-exist on the
    # flags partition (created by tools/make_ab_disk.sh; the kernel resets
    # it in place when slot A boots or slot B confirms). Every B attempt
    # increments the counter; at 3 the pending B request is burned and A
    # boots instead. This closes the old hole where a B image that never
    # came up at all (corrupt ELF, crash before the kernel could write
    # bootfail_B) looped forever.
    load_env -f (hd0,msdos1)/boot/grub/grubenv
    echo AB_ATTEMPTS_LOADED=${ab_attempts}
    if [ "${ab_attempts}" = "3" ]; then
      set slotroot="(hd0,msdos2)"
      set slotid="A"
    else
      # no arithmetic in grub scripts: step the counter by string compare
      # (unset or garbage starts fresh at 1)
      if [ "${ab_attempts}" = "0" ]; then
        set ab_attempts=1
      elif [ "${ab_attempts}" = "1" ]; then
        set ab_attempts=2
      elif [ "${ab_attempts}" = "2" ]; then
        set ab_attempts=3
      else
        set ab_attempts=1
      fi
      save_env -f (hd0,msdos1)/boot/grub/grubenv ab_attempts
      echo AB_ATTEMPTS_SAVED=${ab_attempts}
      set slotroot="(hd0,msdos3)"
      set slotid="B"
    fi
  fi
else
  if [ -f (hd0,msdos1)/boot/ok_B ]; then
    set slotroot="(hd0,msdos3)"
    set slotid="B"
  fi
fi
echo "BOOT_SLOT=${slotid}"

menuentry "Open Cube OS (slot ${slotid})" {
  # BUG-0305: if the selected image cannot even be loaded by GRUB (corrupt
  # ELF), fall back to slot A within the same boot instead of stranding the
  # machine on a GRUB error screen.
  if [ "${slotid}" = "B" ]; then
    if multiboot2 ${slotroot}/boot/opencube.elf oc.slot=${slotid}; then
      module2 ${slotroot}/boot/opencube.elf self
      boot
    fi
    # B image unloadable: same-boot fallback to slot A
    multiboot2 (hd0,msdos2)/boot/opencube.elf oc.slot=A
    module2 (hd0,msdos2)/boot/opencube.elf self
    boot
  fi
  multiboot2 ${slotroot}/boot/opencube.elf oc.slot=${slotid}
  module2 ${slotroot}/boot/opencube.elf self
  boot
}
menuentry "Open Cube OS (slot A, force)" {
  multiboot2 (hd0,msdos2)/boot/opencube.elf oc.slot=A
  module2 (hd0,msdos2)/boot/opencube.elf self
  boot
}
menuentry "Open Cube OS (slot B, force)" {
  multiboot2 (hd0,msdos3)/boot/opencube.elf oc.slot=B
  module2 (hd0,msdos3)/boot/opencube.elf self
  boot
}
