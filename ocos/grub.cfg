# Open Cube OS NAK - GRUB configuration (WP-01-tree).
#
# Boot straight from the config script: `multiboot2` loads the
# kernel right here and `boot` hands control over immediately. No
# menu is ever drawn and no `Booting '<title>'` line is ever printed,
# so GRUB leaves nothing of its own on the VGA text screen - the only
# text on screen when the kernel starts is the firmware boot banner,
# which kmain clears before printing its own four lines.

multiboot2 /boot/kernel.elf
boot
